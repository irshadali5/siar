[package]
name = "siar-android-messaging"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"
rust-version.workspace = true

# The other real gap this workspace's `apps/android/README.md` named
# explicitly: "there is no `siar-messaging::MessageService` FFI surface
# here at all." This crate is that surface. Originally scoped down from
# everything `apps/cli`'s `Bootstrapped` wires up; groups/MLS
# (`GroupService`) and 1:1 attachments have since been added — see this
# crate's own `lib.rs` doc comment for the current, full "what's here
# and what still isn't" accounting (anonymous mailbox path and group
# attachments remain out of scope).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
siar-domain.workspace = true
siar-protocol.workspace = true
siar-crypto.workspace = true
siar-storage.workspace = true
siar-transport.workspace = true
siar-messaging.workspace = true
siar-routing.workspace = true
tokio.workspace = true
tracing.workspace = true
iroh.workspace = true
# Real crate dependency (this crate's `rlib` output, not `cdylib`) —
# lets this crate report its own `SiarEndpoint`'s connectivity
# straight into the shared `ConnectivityState` without a needless JNI
# round-trip through Kotlin and back. See that crate's own `lib.rs` doc
# comment for why `mark_link_up`/`mark_link_down` are plain `pub`
# functions, not only reachable via JNI.
siar-android-connectivity = { path = "../rust-jni-glue" }
uuid.workspace = true
# For the same reason `apps/cli`'s own `base64_encode`/`base64_decode`
# helpers exist: MLS key packages, welcome bytes, and `GroupState` blobs
# all have to move across the JNI boundary (and, for now, out-of-band
# between devices — see `lib.rs`'s doc comment on why) as text, not raw
# bytes, and this crate's own event-line convention is already
# plain-text over JSON.
base64.workspace = true
postcard.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
# jni 0.21, matching every other jni_bridge.rs in this workspace
# exactly.
jni = "0.21"
