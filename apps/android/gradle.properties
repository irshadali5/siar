# AGP 8.7.2 requires this explicitly once any AndroidX dependency is
# declared (androidx.core, androidx.appcompat, androidx.activity,
# androidx.compose.*, all present in app/build.gradle.kts) — omitting
# it fails `:app:checkDebugAarMetadata` with a real, non-optional error,
# not a style warning.
android.useAndroidX=true
# No legacy `com.android.support` dependencies exist anywhere in this
# project (checked app/build.gradle.kts — every dependency here is
# already `androidx.*`), so there is nothing for the Jetifier to
# migrate; disabling it is a real build-time savings, not a
# precautionary default.
android.enableJetifier=false
