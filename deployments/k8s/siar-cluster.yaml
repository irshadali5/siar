apiVersion: v1
kind: Pod
metadata:
  name: siar-alice-phone
  labels:
    app: siar
    user: alice
    device: phone
spec:
  containers:
    - name: siar-cli
      image: archlinux:latest
      imagePullPolicy: IfNotPresent
      command: ["sleep", "infinity"]
      env:
        - name: RUST_LOG
          value: "info"
        - name: RUST_BACKTRACE
          value: "1"
        - name: SIAR_USER
          value: "alice"
        - name: SIAR_DEVICE
          value: "phone"
      volumeMounts:
        - name: nix-store
          mountPath: /nix/store
          readOnly: true
        - name: siar-bin
          mountPath: /usr/local/bin/siar
          readOnly: true
        - name: data-volume
          mountPath: /root/.local/share/siar-cli
  volumes:
    - name: nix-store
      hostPath:
        path: /nix/store
    - name: siar-bin
      hostPath:
        path: /home/irshad/.local/bin/siar
    - name: data-volume
      hostPath:
        path: /tmp/siar-testbed/alice-phone
---
