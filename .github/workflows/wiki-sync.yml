name: Sync Wiki to GitHub Native Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'sys-arch/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync sys-arch files to GitHub Wiki repository
        env:
          ACTION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TEMP_DIR="$(mktemp -d)"
          echo "Copying sys-arch files..."
          cp -r sys-arch/* "$TEMP_DIR/"
          
          cd "$TEMP_DIR"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git branch -M master
          git add .
          git commit -m "docs(wiki): sync 60 system architecture specifications from main repository" || exit 0
          
          WIKI_REPO="https://x-access-token:${ACTION_TOKEN}@github.com/${{ github.repository }}.wiki.git"
          echo "Pushing to GitHub Wiki ($WIKI_REPO)..."
          git push --force "$WIKI_REPO" master || echo "Note: If push fails, make sure GitHub Wiki is initialized on the repo."
