[package]
name = "siar-routing"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
siar-domain.workspace = true
siar-dtn.workspace = true
# Added when PathTable was corrected to key on EndpointId instead of
# DeviceId (see path.rs's top doc comment for why) — this crate still
# doesn't depend on siar-transport or do any I/O; iroh's `EndpointId`/
# `SecretKey` types are used purely as identifiers/test fixtures here,
# never to actually bind a socket or dial anything.
iroh.workspace = true
# Otherwise deliberately nothing else. This crate sits above siar-dtn
# and siar-domain in next.md §4's layer diagram ("Resilient Routing
# Core" above "Transport Manager | DTN | Mesh | Discovery") and needs
# nothing from below that layer — no transport crate, no tokio, no I/O
# beyond the identifier types just noted. Route scoring and the
# priority scheduler are pure decision logic over data a caller
# supplies (PathEntry updates, ConnectivityState, message priority);
# actually measuring RTT/reliability/congestion and acting on a
# scheduler's dequeued items is real-transport work for a later pass,
# same "pure logic first" discipline as siar-transport-ble and
# siar-dtn.
