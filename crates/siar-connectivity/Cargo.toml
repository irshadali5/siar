[package]
name = "siar-connectivity"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
siar-domain.workspace = true
siar-transport.workspace = true
siar-routing-policy.workspace = true
# Needed as of this pass: `TransportManager`/`CandidateTable` name
# `iroh::EndpointId`/`EndpointAddr` directly (matching
# `siar_routing_policy::PathCandidate`'s `endpoint` bytes and
# `DeviceRoutes`'s join — see `device_routes.rs`'s doc comment).
iroh.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
siar-transport-wifi-direct = { path = "../siar-transport-wifi-direct" }
