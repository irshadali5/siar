[application]
name = "Siar"
default_platform = "android"

[bundle]
identifier = "dev.irshad.siar"
icon = ["../../assets/app-icon-1024.png"]

[android]
min_sdk = 26
target_sdk = 34
compile_sdk = 34

[android.signing]
jks_file = "keystore.jks"
jks_password = "password"
key_alias = "siar-key"
key_password = "password"

[android.permissions]
"android.permission.RECORD_AUDIO" = { description = "Voice messages and calls" }
"android.permission.CAMERA" = { description = "Video calls and status capture" }
"android.permission.POST_NOTIFICATIONS" = { description = "Message and call notifications" }
"android.permission.FOREGROUND_SERVICE" = { description = "Keep active calls and peer connectivity running" }
"android.permission.FOREGROUND_SERVICE_MICROPHONE" = { description = "Keep microphone calls running in the background" }
"android.permission.FOREGROUND_SERVICE_CAMERA" = { description = "Keep video calls running in the background" }
"android.permission.FOREGROUND_SERVICE_DATA_SYNC" = { description = "Keep optional peer synchronization running" }
"android.permission.RECEIVE_BOOT_COMPLETED" = { description = "Restart optional peer synchronization after reboot" }
"android.permission.WAKE_LOCK" = { description = "Maintain active calls and transfers" }
"android.permission.BLUETOOTH_SCAN" = { description = "Discover nearby peers" }
"android.permission.BLUETOOTH_CONNECT" = { description = "Connect to nearby peers" }
"android.permission.BLUETOOTH_ADVERTISE" = { description = "Advertise to nearby peers" }
"android.permission.NEARBY_WIFI_DEVICES" = { description = "Discover peers on nearby Wi-Fi" }
"android.permission.ACCESS_WIFI_STATE" = { description = "Detect local peer connectivity" }
"android.permission.CHANGE_WIFI_STATE" = { description = "Support optional local peer connectivity" }
