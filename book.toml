[book]
authors = ["Irshad Ali and SIAR Contributors"]
language = "en"
src = "sys-arch"
title = "SIAR System Architecture & Technical Wiki"
description = "Comprehensive system architecture, cryptographic protocols, DTN mesh networking, distributed storage, audio DSP pipelines, and UI/UX design specifications for SIAR."

[build]
build-dir = "book"
create-missing = false

[output.html]
git-repository-url = "https://github.com/irshadali5/siar"
edit-url-template = "https://github.com/irshadali5/siar/edit/main/{path}"
site-url = "/siar/"
default-theme = "navy"
preferred-dark-theme = "navy"
mathjax-support = true
copy-js = true
additional-css = ["theme/custom.css"]

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = true
level = 1
